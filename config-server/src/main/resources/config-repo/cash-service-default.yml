spring:
  cloud:
    zookeeper:
      connect-string: ${ZOOKEEPER_CONNECT_STRING:localhost:2181}
      discovery:
        enabled: true
        register: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URI:http://localhost:9990/realms/bank-realm}
      client:
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_URI:http://localhost:9990/realms/bank-realm}
        registration:
          cash-service-client-credentials:
            provider: keycloak
            client-id: ${KEYCLOAK_CASH_SERVICE_ID:cash-service}
            client-secret: ${CASH_SERVICE_CLIENT_SECRET}
            authorization-grant-type: client_credentials

accounts:
  base-url: http://accounts-service

server:
  port: 8082