server:
  port: ${PORT:8080}

spring:
  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_URI:http://localhost:9990/realms/bank-realm}
            user-name-attribute: "preferred_username"
        registration:
          keycloak:
            provider: "keycloak"
            client-id: ${KEYCLOAK_CLIENT_ID:bank-app}
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            authorization-grant-type: "authorization_code"
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: "openid,profile,email"
          gateway-client-credentials:
            provider: "keycloak"
            client-id: ${KEYCLOAK_GATEWAY_ID:gateway_service}
            client-secret: ${GATEWAY_SERVICE_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            scope: gateway.read
gateway:
  base-url: http://application-gateway