version: '3.8'
services:
  zookeeper:
    image: zookeeper:3.9.3
    container_name: bank-zookeeper
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181
      - ZOOKEEPER_SERVER_ID=1
    restart: unless-stopped
    ports:
      - "2181:2181"
    healthcheck:
      test: [ "CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep imok" ]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - zookeeper-data:/data
      - zookeeper-datalog:/datalog
    networks:
      - bank-network

networks:
  bank-network:
    driver: bridge

volumes:
  zookeeper-data:
  zookeeper-datalog: